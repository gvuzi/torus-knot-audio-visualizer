<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Torus Knot Audio Visualizer</title>
    <link rel="icon" href="/icon.ico">
    <link rel="stylesheet" href="src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="main-content-container">
            <h1>torus knot audio visualizer</h1>
            <div class="buttons-container">
                <label for="audio_file">choose audio
                <input type="file" id="audio_file" hidden/>
                </label>
                <button id="demo_button">play demo</button>
            </div>
            <div class="icons-container">
                <a class="icon" href="https://github.com/gvuzi/torus-knot-audio-visualizer">
                    <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                    </svg><a>
                <a class="icon" href="https://gvuzi.pages.dev">
                    <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                      <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                    </svg></a>
            </div>
        </div>
    </div>
    <div class="volume-container">
        <p>not working properly? try adjusting volume</p>
        <input type="range" min="0" max="200" value="100" step="5" id="volume_slider"/>
        <p id="volume">100%</p>
    </div>
    <div class="exit-container">
        <button id="main_menu_button">main menu</button>
    </div>
    <div id="main-scene"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
